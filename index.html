<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QyxnoraCore v2 - Smart Number Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #080b13;
    color: #e2e8f0;
    min-height: 100vh;
}

/* Phone Style Screen Lock Overlay */
.lock-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #080b13;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
}

.lock-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 35px 25px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.lock-avatar {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #ec4899, #3b82f6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 15px auto;
}

.lock-card h3 {
    font-size: 18px;
    color: #ffffff;
    margin-bottom: 5px;
}

.lock-card p {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 20px;
}

.pin-input {
    width: 100%;
    padding: 14px;
    background: #0f172a;
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #ffffff;
    text-align: center;
    font-size: 18px;
    letter-spacing: 4px;
    outline: none;
    margin-bottom: 15px;
    transition: 0.3s;
}

.pin-input:focus {
    border-color: #3b82f6;
}

.error-txt {
    color: #f43f5e;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
    display: none;
}

/* App Container */
.app-container {
    display: none; /* Screen Locked by Default */
    width: 100%;
    min-height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 320px;
    background: #0d111d;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.brand-title {
    font-size: 14px;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.relock-btn {
    background: rgba(225, 29, 72, 0.2);
    border: 1px solid rgba(225, 29, 72, 0.4);
    color: #f43f5e;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
}

.section-label {
    font-size: 11px;
    color: #64748b;
    font-weight: bold;
    letter-spacing: 0.5px;
}

.project-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 250px;
    overflow-y: auto;
}

.project-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.project-card.active {
    border-color: #3b82f6;
    background: rgba(59, 130, 246, 0.1);
}

.proj-info-left {
    flex: 1;
}

.proj-header {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
}

.proj-stats {
    font-size: 10px;
    color: #94a3b8;
    display: flex;
    gap: 10px;
}

.delete-proj-btn {
    background: rgba(225, 29, 72, 0.2);
    border: 1px solid rgba(225, 29, 72, 0.4);
    color: #f43f5e;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: 0.2s;
}

.delete-proj-btn:hover {
    background: #e11d48;
    color: white;
}

.new-project-box {
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 12px;
}

.new-project-box h4 {
    font-size: 12px;
    color: #f59e0b;
    margin-bottom: 8px;
}

.new-project-box label {
    font-size: 11px;
    color: #94a3b8;
    display: block;
    margin-bottom: 4px;
}

.new-project-box textarea, .new-project-box input {
    width: 100%;
    background: #050816;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 8px;
    color: white;
    font-size: 12px;
    margin-bottom: 8px;
    outline: none;
}

.new-project-box textarea {
    height: 140px;
    resize: none;
}

/* Main Content Area */
.main-content {
    flex: 1;
    padding: 20px 30px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.header-banner {
    text-align: center;
}

.header-banner h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #ec4899, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header-banner p {
    font-size: 13px;
    color: #94a3b8;
}

/* Stats Cards */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.stat-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: rgba(255, 255, 255, 0.05);
}

.stat-info .title {
    font-size: 11px;
    color: #94a3b8;
}

.stat-info .num {
    font-size: 22px;
    font-weight: bold;
}

/* Search and Controls */
.search-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.search-input {
    flex: 1;
}

.search-input input {
    width: 100%;
    padding: 10px 15px;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    color: white;
    outline: none;
}

.filter-btns {
    display: flex;
    background: #0f172a;
    border-radius: 8px;
    padding: 3px;
}

.filter-btn {
    padding: 8px 15px;
    border: none;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    border-radius: 6px;
    font-size: 12px;
}

.filter-btn.active {
    background: #1e293b;
    color: white;
}

/* Numbers List */
.number-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 400px;
    overflow-y: auto;
    min-height: 100px;
}

.number-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
}

.number-row.is-copied {
    background: rgba(225, 29, 72, 0.25) !important;
    border-color: rgba(225, 29, 72, 0.5) !important;
}

.num-details {
    display: flex;
    align-items: center;
    gap: 20px;
}

.country-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    width: 180px;
    color: #8ec5ff;
}

.num-val {
    font-size: 16px;
    font-weight: 700;
}

.copy-btn {
    background: #10b981;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}

.copy-btn.copied {
    background: transparent;
    color: #ffffff;
}

/* Bottom Actions */
.actions-container {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 15px;
    border-radius: 12px;
}

.actions-title {
    font-size: 11px;
    color: #64748b;
    font-weight: bold;
    margin-bottom: 10px;
}

.inputs-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
}

.inputs-row input {
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px;
    color: white;
    outline: none;
}

.action-buttons-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.act-btn {
    padding: 12px;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

.btn-emerald { background: #059669; }
.btn-blue { background: #2563eb; }
.btn-indigo { background: #4f46e5; }
.btn-red { background: #e11d48; }
.btn-purple { background: #9333ea; }

@media(max-width: 900px) {
    .app-container { flex-direction: column; }
    .sidebar { width: 100%; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .action-buttons-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<body>

<!-- Screen Lock Overlay -->
<div class="lock-screen" id="lockScreen">
    <div class="lock-card">
        <div class="lock-avatar">🔐</div>
        <h3>Protected System</h3>
        <p>Enter Access PIN to Continue</p>
        
        <input type="password" id="pinInput" class="pin-input" placeholder="Enter PIN" maxlength="15" onkeypress="if(event.key==='Enter') validatePin()">
        <div class="error-txt" id="errorTxt">Incorrect Access PIN!</div>
        
        <button class="act-btn btn-purple" style="width: 100%; font-size: 14px;" onclick="validatePin()">Unlock System</button>
    </div>
</div>

<!-- Main App Container -->
<div class="app-container" id="appContainer">
    
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand-title">
            <span>💻 DASHBOARD</span>
            <button class="relock-btn" onclick="relockApp()">🔒 Lock Screen</button>
        </div>

        <div class="new-project-box">
            <h4>+ PASTE DATA HERE</h4>
            <label>1. Paste Lamix / Raw Data</label>
            <textarea id="numbers" placeholder="Paste data containing numbers here..." oninput="loadNumbersFromText()"></textarea>
            
            <label>2. Project Name (Optional)</label>
            <input type="text" id="projNameInput" placeholder="e.g. Algeria Facebook OTP">
            
            <button class="act-btn btn-purple" style="width: 100%;" onclick="saveProject()">💾 Save Project</button>
        </div>

        <div class="section-label">SAVED PROJECTS</div>
        <div class="project-list" id="projectList"></div>
    </div>

    <!-- Main Section -->
    <div class="main-content">
        
        <div class="header-banner">
            <h1>QyxnoraCore v2</h1>
            <p>Smart Number Manager</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-icon" style="color: #3b82f6;">📊</div>
                <div class="stat-info">
                    <div class="title">Total</div>
                    <div class="num" id="total">0</div>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-icon" style="color: #ec4899;">📋</div>
                <div class="stat-info">
                    <div class="title">Copied</div>
                    <div class="num" id="copied">0</div>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-icon" style="color: #6366f1;">⏳</div>
                <div class="stat-info">
                    <div class="title">Remaining</div>
                    <div class="num" id="remaining">0</div>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-icon" style="color: #10b981;">🌐</div>
                <div class="stat-info">
                    <div class="title">Countries</div>
                    <div class="num" id="countries">0</div>
                </div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="search-controls">
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="Search number..." oninput="render()">
            </div>
            <div class="filter-btns">
                <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
                <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
                <button class="filter-btn" onclick="setFilter('copied', this)">Copied</button>
            </div>
            <button class="act-btn btn-emerald" onclick="downloadTxt()">📥 Export TXT</button>
        </div>

        <!-- Numbers List Area -->
        <div class="number-list" id="result"></div>

        <!-- Quick Actions -->
        <div class="actions-container">
            <div class="actions-title">+ QUICK ACTIONS</div>
            
            <div class="inputs-row">
                <input id="removePrefixVal" placeholder="Remove Prefix (e.g. 216)">
                <input id="addPrefixVal" placeholder="Add Prefix (e.g. 216)">
            </div>

            <div class="action-buttons-grid">
                <button class="act-btn btn-emerald" onclick="removePrefix()">Remove Prefix</button>
                <button class="act-btn btn-blue" onclick="addPrefix()">Add Prefix</button>
                <button class="act-btn btn-blue" onclick="addPlus()">Add +</button>
                <button class="act-btn btn-red" onclick="removePlus()">Remove +</button>
                <button class="act-btn btn-purple" onclick="removeDuplicate()">Remove Duplicate</button>
                <button class="act-btn btn-indigo" onclick="copyAll()">Copy All</button>
                <button class="act-btn btn-emerald" onclick="downloadTxt()">Download TXT</button>
                <button class="act-btn btn-red" onclick="clearAll()">Clear All</button>
            </div>
        </div>

    </div>
</div>

<script>
// ==================== LOCK SCREEN SYSTEM ====================
const MY_PIN = "78583636"; // 🔑 আপনার পছন্দের সিক্রেট পিন সেট করা হলো

function validatePin(){
    let userPin = document.getElementById("pinInput").value;
    
    if(userPin === MY_PIN){
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("appContainer").style.display = "flex";
        sessionStorage.setItem("qyxnora_unlocked", "true");
    } else {
        document.getElementById("errorTxt").style.display = "block";
        document.getElementById("pinInput").value = "";
    }
}

function relockApp(){
    sessionStorage.removeItem("qyxnora_unlocked");
    document.getElementById("pinInput").value = "";
    document.getElementById("errorTxt").style.display = "none";
    document.getElementById("lockScreen").style.display = "flex";
    document.getElementById("appContainer").style.display = "none";
}

// চেক করে দেখা আগে আনলক ছিল কিনা
if(sessionStorage.getItem("qyxnora_unlocked") === "true"){
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("appContainer").style.display = "flex";
}

// ==================== MAIN DASHBOARD LOGIC ====================
let currentItems = [];
let projects = JSON.parse(localStorage.getItem('qyxnora_projects')) || [];
let activeProjIndex = -1;
let currentFilter = 'all';

const flags = {
    "Comoros":"🇰🇲","Tanzania":"🇹🇿","Palestine":"🇵🇸","Sri Lanka":"🇱🇰",
    "Cambodia":"🇰🇭","Malaysia":"🇲🇾","Algeria":"🇩🇿","Myanmar":"🇲🇲",
    "Angola":"🇦🇴","Afghanistan":"🇦🇫","Argentina":"🇦🇷","Armenia Karabakh":"🇦🇲",
    "Armenia":"🇦🇲","Azerbaijan":"🇦🇿","Belarus":"🇧🇾","Benin":"🇧🇯",
    "Bhutan":"🇧🇹","Bolivia":"🇧🇴","Bulgaria":"🇧🇬","Burkina":"🇧🇫",
    "Cameroon":"🇨🇲","Ecuador":"🇪🇨","Egypt":"🇪🇬","Ethiopia":"🇪🇹",
    "Gabon":"🇬🇦","Georgia":"🇬🇪","Germany":"🇩🇪","Guinea":"🇬🇳",
    "Indonesia":"🇮🇩","Iraq":"🇮🇶","Ivory Coast":"🇨🇮","Jordan":"🇯🇴",
    "Kazakhstan":"🇰🇿","Kenya":"🇰🇪","Kosovo":"🇽🇰","Kuwait":"🇰🇼",
    "Kyrgyzstan":"🇰🇬","Lesotho":"🇱🇸","Libya":"🇱🇾","Madagascar":"🇲🇬",
    "Mauritania":"🇲🇷","Moldova":"🇲🇩","Mongolia":"🇲🇳","Morocco":"🇲🇦",
    "Mozambique":"🇲🇿","Nepal":"🇳🇵","Niger":"🇳🇪","Nigeria":"🇳🇬",
    "Oman":"🇴🇲","Pakistan":"🇵🇰","Russia (Many Series)":"🇷🇺","Russia":"🇷🇺",
    "Saudi Arabia":"🇸🇦","Senegal":"🇸🇳","Slovenia (K)":"🇸🇮","Slovenia":"🇸🇮",
    "Sudan (Sudatel)":"🇸🇩","Sudan":"🇸🇩","Syria":"🇸🇾","Tajikistan":"🇹🇯",
    "Tunisia":"🇹🇳","Uganda":"🇺🇬","Ukraine":"🇺🇦","United Arab Emirates":"🇦🇪",
    "UAE":"🇦🇪","Uzbekistan":"🇺🇿","Vietnam (Mobifone)":"🇻🇳","Vietnam":"🇻🇳","Zimbabwe":"🇿🇼"
};

function detectCountry(text){
    for(let country in flags){
        if(text.includes(country)){ return country; }
    }
    return "Unknown";
}

function loadNumbersFromText(){
    activeProjIndex = -1;
    let text = document.getElementById("numbers").value;
    let lines = text.split("\n");
    currentItems = [];

    lines.forEach(line => {
        let match = line.match(/\d{8,15}/);
        if(match){
            currentItems.push({
                number: match[0],
                country: detectCountry(line),
                copied: false
            });
        }
    });

    renderSidebar();
    render();
}

function render(){
    let result = document.getElementById("result");
    result.innerHTML = "";

    let searchVal = document.getElementById("searchInput").value.toLowerCase();
    let countrySet = new Set();
    let copiedCount = 0;

    currentItems.forEach(item => {
        if(item.copied) copiedCount++;
        countrySet.add(item.country);
    });

    let filteredItems = currentItems.filter(item => {
        let matchesSearch = item.number.toLowerCase().includes(searchVal) || item.country.toLowerCase().includes(searchVal);
        if(currentFilter === 'copied') return matchesSearch && item.copied;
        if(currentFilter === 'pending') return matchesSearch && !item.copied;
        return matchesSearch;
    });

    filteredItems.forEach((item) => {
        let flag = flags[item.country] || "🌍";
        let row = document.createElement("div");
        row.className = `number-row ${item.copied ? 'is-copied' : ''}`;

        row.innerHTML = `
            <div class="num-details">
                <div class="country-tag">${flag} ${item.country}</div>
                <div class="num-val">${item.number}</div>
            </div>
            <button class="copy-btn ${item.copied ? 'copied' : ''}" onclick="copyNumber('${item.number}')">
                ${item.copied ? 'Copied ✓' : '📋 Copy'}
            </button>
        `;
        result.appendChild(row);
    });

    document.getElementById("total").innerText = currentItems.length;
    document.getElementById("copied").innerText = copiedCount;
    document.getElementById("remaining").innerText = currentItems.length - copiedCount;
    document.getElementById("countries").innerText = countrySet.size;
}

function copyNumber(num){
    navigator.clipboard.writeText(num);
    let item = currentItems.find(x => x.number === num);
    if(item){
        item.copied = true;
        updateActiveProject();
        render();
    }
}

function copyAll(){
    if(currentItems.length === 0) return;
    let uncopied = currentItems.filter(x => !x.copied).map(x => x.number).join("\n");
    if(!uncopied) uncopied = currentItems.map(x => x.number).join("\n");

    navigator.clipboard.writeText(uncopied);
    currentItems.forEach(x => x.copied = true);
    updateActiveProject();
    render();
    alert("Copied All Numbers!");
}

function removePrefix(){
    let prefix = document.getElementById("removePrefixVal").value.trim();
    if(!prefix || currentItems.length === 0) return;

    currentItems.forEach(item => {
        if(item.number.startsWith(prefix)){
            item.number = item.number.slice(prefix.length);
        }
    });
    updateActiveProject();
    render();
}

function addPrefix(){
    let prefix = document.getElementById("addPrefixVal").value.trim();
    if(!prefix || currentItems.length === 0) return;

    currentItems.forEach(item => {
        item.number = prefix + item.number;
    });
    updateActiveProject();
    render();
}

function addPlus(){
    if(currentItems.length === 0) return;
    currentItems.forEach(item => {
        if(!item.number.startsWith("+")) item.number = "+" + item.number;
    });
    updateActiveProject();
    render();
}

function removePlus(){
    if(currentItems.length === 0) return;
    currentItems.forEach(item => {
        item.number = item.number.replace(/^\+/, '');
    });
    updateActiveProject();
    render();
}

function removeDuplicate(){
    let seen = new Set();
    currentItems = currentItems.filter(item => {
        if(seen.has(item.number)) return false;
        seen.add(item.number);
        return true;
    });
    updateActiveProject();
    render();
}

function clearAll(){
    currentItems = [];
    document.getElementById("numbers").value = "";
    updateActiveProject();
    render();
}

function setFilter(type, btn){
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

/* Projects Functions */
function saveProject(){
    let projName = document.getElementById("projNameInput").value.trim() || "Untitled Project";
    if(currentItems.length === 0) return alert("Please paste some data first!");

    let newProj = {
        name: projName,
        items: JSON.parse(JSON.stringify(currentItems))
    };

    projects.push(newProj);
    activeProjIndex = projects.length - 1;
    saveToStorage();
    renderSidebar();
    alert("Project Saved Successfully!");
}

function deleteProject(index, event){
    event.stopPropagation();
    if(confirm("Are you sure you want to delete this project?")){
        projects.splice(index, 1);
        if(activeProjIndex === index){
            activeProjIndex = -1;
            currentItems = [];
            document.getElementById("numbers").value = "";
        } else if(activeProjIndex > index){
            activeProjIndex--;
        }
        saveToStorage();
        renderSidebar();
        render();
    }
}

function updateActiveProject(){
    if(activeProjIndex >= 0 && projects[activeProjIndex]){
        projects[activeProjIndex].items = JSON.parse(JSON.stringify(currentItems));
        saveToStorage();
        renderSidebar();
    }
}

function saveToStorage(){
    localStorage.setItem('qyxnora_projects', JSON.stringify(projects));
}

function renderSidebar(){
    let list = document.getElementById("projectList");
    list.innerHTML = "";

    projects.forEach((p, idx) => {
        let total = p.items.length;
        let copied = p.items.filter(x => x.copied).length;

        let card = document.createElement("div");
        card.className = `project-card ${idx === activeProjIndex ? 'active' : ''}`;
        card.onclick = () => { 
            activeProjIndex = idx; 
            currentItems = JSON.parse(JSON.stringify(p.items));
            renderSidebar();
            render();
        };

        card.innerHTML = `
            <div class="proj-info-left">
                <div class="proj-header">📖 ${p.name}</div>
                <div class="proj-stats">
                    <span>${total} Numbers</span>
                    <span>${copied} Copied</span>
                </div>
            </div>
            <button class="delete-proj-btn" onclick="deleteProject(${idx}, event)">🗑️</button>
        `;
        list.appendChild(card);
    });
}

function downloadTxt(){
    if(currentItems.length === 0) return;
    let text = currentItems.map(x => x.number).join("\n");
    let blob = new Blob([text], {type: "text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `numbers.txt`;
    a.click();
}

renderSidebar();
render();
</script>

</body>
</html>
