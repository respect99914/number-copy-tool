<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QyxnoraCore v2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

<div class="logo">
<h2>QyxnoraCore</h2>
<p>Project Manager</p>
</div>

<button id="newProjectBtn" class="mainBtn">
➕ New Project
</button>

<div id="projectList"></div>

</div>

<div class="main">

<header>

<h1 id="projectTitle">
No Project Selected
</h1>

<div id="saveStatus">
Auto Save ✓
</div>

</header>

<div class="glass">

<input
type="text"
id="projectName"
placeholder="Project Name">

<textarea
id="numbers"
placeholder="Paste Lamix Data Here...">
</textarea>

</div>

<div class="grid">

<input
id="removePrefix"
placeholder="Remove Prefix">

<button
onclick="removePrefix()">
Remove Prefix
</button>

<input
id="addPrefix"
placeholder="Add Prefix">

<button
onclick="addPrefix()">
Add Prefix
</button>

<button onclick="addPlus()">
Add +
</button>

<button onclick="removePlus()">
Remove +
</button>

<button onclick="removeDuplicate()">
Remove Duplicate
</button>

<button onclick="copyAll()">
Copy All
</button>

<button onclick="downloadTxt()">
Download TXT
</button>

</div>

<div class="stats">

<div class="card">

<div>Total</div>

<h2 id="total">
0
</h2>

</div>

<div class="card">

<div>Copied</div>

<h2 id="copied">
0
</h2>

</div>

<div class="card">

<div>Pending</div>

<h2 id="remaining">
0
</h2>

</div>

<div class="card">

<div>Countries</div>

<h2 id="countries">
0
</h2>

</div>

</div>

<div id="result"></div>

</div>

<script src="storage.js"></script>
<script src="project.js"></script>
<script src="app.js"></script>

</body>
  </html>
